name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Playwright 1.60 supports 24.04; ubuntu-latest has moved to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=1024
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Verify workflow syntax and scan full Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          audit_tools="$RUNNER_TEMP/minimera-audit-tools"
          mkdir -p "$audit_tools"
          curl --fail --location --retry 3 --output "$audit_tools/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $audit_tools/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$audit_tools/actionlint.tar.gz" -C "$audit_tools" actionlint
          "$audit_tools/actionlint" -color
          curl --fail --location --retry 3 --output "$audit_tools/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $audit_tools/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$audit_tools/gitleaks.tar.gz" -C "$audit_tools" gitleaks
          "$audit_tools/gitleaks" git --redact --no-banner .
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check style, types, behavior and Worker parity
        run: python scripts/check.py
      - name: Install Order Integrity interface dependencies
        run: npm ci --prefix ui --no-audit --no-fund
      - name: Check dependency advisories, including development tools
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --strict -r requirements-dev.txt
          npm audit --prefix ui --audit-level=low
      - name: Check and build Order Integrity interface
        run: |
          npm run check --prefix ui
          npm run build --prefix ui
      - name: Install Chromium for the judge walkthrough
        run: python -m playwright install --with-deps chromium
      - name: Replay the complete judge walkthrough
        run: python scripts/verify_judge_demo.py
      - name: Build the Order Integrity container
        run: docker build -t minimera:ci .
      - name: Replay the judge walkthrough in the container
        run: python scripts/verify_container_demo.py --image minimera:ci
      - name: Preserve browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: synthetic-browser-diagnostics
          path: |
            runtime/judge-demo/
            runtime/container-demo/
          retention-days: 45
          if-no-files-found: ignore
