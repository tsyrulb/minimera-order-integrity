[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["runtime", "private", "site"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C4"]

# Directly executable tools resolve their own repository before importing it.
[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["ntk"]
strict = true
show_error_codes = true
pretty = true
