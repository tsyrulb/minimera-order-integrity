services:
  - type: web
    name: minimera
    runtime: docker
    plan: free
    healthCheckPath: /api/integrity/health
    envVars:
      - key: NTK_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: NTK_RUNTIME_DIR
        value: /app/runtime
      - key: FORWARDED_ALLOW_IPS
        value: "*"
# Render terminates HTTPS and forwards requests to its private container port.
# Trust this platform proxy only; do not expose that port directly.
# The hostname is supplied through RENDER_EXTERNAL_HOSTNAME.
# Hosted mode uses simulated payments and recorded Bedrock answers.
# Real Sandbox writes and fresh Bedrock calls remain loopback-only.
